[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinwatch"
version = "0.1.0"
description = "Live 12VHPWR connector load monitor for NVIDIA GPUs on Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
pinwatch = "pinwatch.cli:main"

[tool.setuptools]
packages = ["pinwatch"]
